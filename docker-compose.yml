services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./recurring.yml:/app/recurring.yml:ro

  # Read-only stats one-pager. This is the only service allowed to publish a
  # host port — the bot service must stay port-free (see AGENTS.md).
  stats:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "stats"]
    env_file: .env
    environment:
      STATS_PORT: "8080"
    ports:
      - "${STATS_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data:ro
