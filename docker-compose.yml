services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./recurring.yml:/app/recurring.yml:ro

  # Read-only stats one-pager. Reachable by barcheck Caddy on the shared Docker
  # network (see STATS_CADDY_NETWORK). Host port is localhost-only for curl
  # debugging — not 0.0.0.0 — once HTTPS is wired up (see deploy/caddy-finappa.caddy).
  stats:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "stats"]
    env_file: .env
    environment:
      STATS_PORT: "8080"
    ports:
      - "127.0.0.1:${STATS_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data:ro
    networks:
      - default
      - caddy

networks:
  caddy:
    external: true
    name: ${STATS_CADDY_NETWORK:-barcheck_default}
