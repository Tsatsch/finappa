<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>finappa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <header class="hero">
    <p class="eyebrow">Personal ledger</p>
    <h1>finappa</h1>
    <p class="lede">Income, expenses, and trends — live from your bot ledger.</p>
  </header>

  <section class="filters" aria-label="Filters">
    <label>
      Year
      <select id="filter-year"></select>
    </label>
    <label>
      Month
      <select id="filter-month"></select>
    </label>
    <label>
      Category
      <select id="filter-category"></select>
    </label>
    <label>
      Type
      <select id="filter-type">
        <option value="ALL">All</option>
        <option value="EXPENSE">Expense</option>
        <option value="INCOME">Income</option>
      </select>
    </label>
    <p id="meta" class="meta"></p>
  </section>

  <section class="kpis" aria-label="Period totals">
    <article class="kpi">
      <h2>Income</h2>
      <p id="kpi-income" class="kpi-value">—</p>
    </article>
    <article class="kpi">
      <h2>Expenses</h2>
      <p id="kpi-expenses" class="kpi-value">—</p>
    </article>
    <article class="kpi kpi-net">
      <h2>Net</h2>
      <p id="kpi-net" class="kpi-value">—</p>
    </article>
  </section>

  <section class="period">
    <h2 class="section-title">This period</h2>
    <div class="charts">
      <figure class="chart-card">
        <figcaption>Spend by category</figcaption>
        <canvas id="chart-category"></canvas>
      </figure>
      <figure class="chart-card" id="daily-card">
        <figcaption>Daily expenses</figcaption>
        <canvas id="chart-daily"></canvas>
      </figure>
      <figure class="chart-card chart-card-wide" id="merchant-card">
        <figcaption>Spend by merchant</figcaption>
        <canvas id="chart-merchant"></canvas>
      </figure>
    </div>
    <div class="merchant-table-wrap" id="merchant-table-wrap">
      <table class="merchant-table" id="merchant-table" aria-label="Merchant totals">
        <thead>
          <tr>
            <th scope="col">Merchant</th>
            <th scope="col">Total</th>
            <th scope="col">Visits</th>
          </tr>
        </thead>
        <tbody id="merchant-table-body"></tbody>
      </table>
    </div>
  </section>

  <section class="trends">
    <h2 class="section-title">Trends</h2>
    <div class="charts">
      <figure class="chart-card">
        <figcaption>Income vs expenses by month</figcaption>
        <canvas id="chart-monthly"></canvas>
      </figure>
      <figure class="chart-card">
        <figcaption>Category mix over months</figcaption>
        <canvas id="chart-category-trend"></canvas>
      </figure>
    </div>
  </section>

  <footer class="footer">
    <p>Read-only · EUR · amounts from finappa SQLite</p>
  </footer>
</body>
</html>
